name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Expo inlines EXPO_PUBLIC_* while the web bundle is built. Prefer
    # repository/environment secrets, but also accept GitHub Actions variables.
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_NFC_BASE_URL: ${{ secrets.EXPO_PUBLIC_NFC_BASE_URL || vars.EXPO_PUBLIC_NFC_BASE_URL }}
      EXPO_PUBLIC_NFC_DOMAIN: ${{ secrets.EXPO_PUBLIC_NFC_DOMAIN || vars.EXPO_PUBLIC_NFC_DOMAIN }}
      EXPO_PUBLIC_HOUSEHOLD_AUTHORIZATION_PASSWORD: ${{ secrets.EXPO_PUBLIC_HOUSEHOLD_AUTHORIZATION_PASSWORD || vars.EXPO_PUBLIC_HOUSEHOLD_AUTHORIZATION_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase configuration
        run: |
          missing=0
          for variable in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!variable}" ]; then
              echo "::error title=Missing deployment variable::$variable no está configurada en Secrets ni Variables de GitHub."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build and deploy to Cloudflare Workers
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
